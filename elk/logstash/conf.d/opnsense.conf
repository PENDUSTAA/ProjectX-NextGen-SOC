# OPNsense filterlog (RFC5424 over UDP) -> ECS -> logs-opnsense-default
input {
  udp { port => 5514 tags => ["opnsense"] }
}

filter {
  grok {
    match => { "message" => "^<%{NONNEGINT:[log][syslog][priority]}>1 %{TIMESTAMP_ISO8601:syslog_ts} %{NOTSPACE:[host][hostname]} %{NOTSPACE:[process][name]} %{NOTSPACE:[process][pid]} %{NOTSPACE} (?:-|(?:\[[^\]]*\])+) ?%{GREEDYDATA:syslog_msg}$" }
    tag_on_failure => ["_grok_syslog_fail"]
  }
  date { match => ["syslog_ts", "ISO8601"] remove_field => ["syslog_ts"] }

  if [process][name] == "filterlog" {
    # IPv4 layout. TCP lines carry 29 fields, so all 29 are named.
    csv {
      source => "syslog_msg"
      columns => ["[rule][id]","subrule","anchor","[rule][uuid]","[observer][ingress][interface][name]",
                  "[event][reason]","[event][action]","[opnsense][dir]","ipver","tos","ecn","ttl","ipid",
                  "offset","ipflags","protonum","[network][transport]","[network][bytes]",
                  "[source][ip]","[destination][ip]",
                  "f21","f22","f23","f24","f25","f26","f27","f28","f29"]
      skip_empty_columns => true
    }
    if [network][transport] in ["tcp","udp"] {
      mutate {
        rename  => { "f21" => "[source][port]" "f22" => "[destination][port]" }
        convert => { "[source][port]" => "integer" "[destination][port]" => "integer" }
      }
    }
    if [network][transport] == "tcp" {
      mutate { rename => { "f24" => "[opnsense][tcp_flags]" } }
    }
    mutate {
      add_field    => { "[event][dataset]" => "opnsense.firewall" "[observer][vendor]" => "OPNsense" }
      convert      => { "[network][bytes]" => "integer" }
      remove_field => ["subrule","anchor","ipver","tos","ecn","ttl","ipid","offset","ipflags","protonum",
                       "f21","f22","f23","f24","f25","f26","f27","f28","f29"]
    }
  }
}

output {
  elasticsearch {
    hosts       => ["https://192.168.50.10:9200"]
    user        => "logstash_writer"
    password    => "${LOGSTASH_WRITER_PASSWORD}"
    ssl_certificate_authorities => ["/etc/logstash/certs/http_ca.crt"]
    data_stream => true
    data_stream_type      => "logs"
    data_stream_dataset   => "opnsense"
    data_stream_namespace => "default"
  }
}
