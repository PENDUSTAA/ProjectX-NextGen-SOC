# Block spike: blocked firewall events in the last 5 min are 4x the 5 min before, and at least 300.
# Catches scans, floods and misbehaving hosts as a whole; the per-source rules name the culprit.
# Tune threshold_cur / spike_height to the lab's normal block rate (Kibana: event.action:block, 5 min buckets).
name: opnsense-block-spike
description: "Blocked OPNsense events spike to 4x the previous 5 minutes (minimum 300 in 5 minutes)"
index: logs-opnsense-default
type: spike
spike_type: up
spike_height: 4
threshold_cur: 300
timeframe:
  minutes: 5
realert:
  minutes: 30
filter:
- term:
    event.dataset: opnsense.firewall
- term:
    event.action: block
alert:
- post2
http_post2_url: "__SHUFFLE_WEBHOOK_URL__"
http_post2_ignore_ssl_errors: true
jinja_root_name: _data
http_post2_payload:
  title: "Spike in blocked traffic on OPNsense"
  description: >-
    Blocked events in the last 5 minutes: {{ spike_count }} (previous 5 minutes: {{ reference_count }}).
    Sample blocked source: {{ source.ip }} -> {{ destination.ip }}:{{ destination.port }} on {{ observer.ingress.interface.name }}.
    Check the port-scan and brute-force alerts for the same time.
  type: "blockspike"
  ref: "blockspike-{{ _data['@timestamp'] }}"
  src_ip: "{{ source.ip }}"
