# Block burst: 30+ blocked firewall events within 5 minutes, across all sources.
# Baseline measured 2026-10-14: 0-6 blocked events per HOUR, so 30 in 5 min is far above normal.
# Fixed threshold (frequency), not a spike ratio: with a near-zero baseline a steady burst never
# reaches "4x the previous window" (replay of the 17:00-17:45 burst: 229 blocks, 0 spike matches).
# Catches scans, floods and misconfigurations as a whole; the per-source rules name the culprit.
name: opnsense-block-spike
description: "30 or more blocked OPNsense events within 5 minutes (normal: 0-6 per hour)"
index: logs-opnsense-default
type: frequency
num_events: 30
timeframe:
  minutes: 5
realert:
  minutes: 30
filter:
- term:
    event.dataset: opnsense.firewall
- term:
    event.action: block
alert:
- post2
http_post2_url: "__SHUFFLE_WEBHOOK_URL__"
http_post2_ignore_ssl_errors: true
jinja_root_name: _data
http_post2_payload:
  title: "Burst of blocked traffic on OPNsense"
  description: >-
    30 or more blocked firewall events within 5 minutes (normal: 0-6 per hour).
    Latest blocked: {{ source.ip }} -> {{ destination.ip }}:{{ destination.port }} on {{ observer.ingress.interface.name }}.
    Check port-scan and brute-force alerts for the same time.
  type: "blockburst"
  ref: "blockburst-{{ _data['@timestamp'] }}"
  src_ip: "{{ source.ip }}"
  mitre: "T1595"
  tactic: "reconnaissance"
